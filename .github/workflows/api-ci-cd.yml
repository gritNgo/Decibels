name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/api-ci-cd.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

permissions:
  id-token: write
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore backend/Decibels.sln

      - name: Execute Core API Boundary Tests (TDD Contract Focus)
        run: dotnet test backend/Decibels.sln --configuration Release --no-restore

  deploy-to-azure:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC Workload Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        run: az acr login --name decibelsregistry

      - name: Build and Push Production Docker Image
        run: |
          docker build -t decibelsregistry.azurecr.io/decibels-api:${{ github.sha }} -f backend/Dockerfile backend/
          docker push decibelsregistry.azurecr.io/decibels-api:${{ github.sha }}

      - name: Deploy Revision to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: decibelsregistry
          containerAppName: ca-decibels-api-prod
          resourceGroup: rg-decibels-prod
          imageToDeploy: decibelsregistry.azurecr.io/decibels-api:${{ github.sha }}